
<!--EDIT CARD PAGE OF HTML DESIGN-->
<html>
<head>
    <title>Edit Card</title>
</head>

<body>
    <font face="Verdana, Sans Serif">

    <!-- PAGE TITLE -->
    <h1 align="center">Edit the Card</h1>

    <br>
    <br>

 <!-- QUESTION INPUT -->
<div style="display: flex; align-items: center;">
    <label>Question:</label>
    <input type="text" id="question" size="70"
           placeholder="Enter your question"
           style="position: absolute; left: 35%; width: 30%;">
</div>

<br>
<br>

<!-- ANSWER INPUT -->
<div style="display: flex; align-items: center;">
    <label>Answer:</label>
    <input type="text" id="answer" size="70"
           placeholder="Enter your answer"
           style="position: absolute; left: 35%; width: 30%;">
</div>
<br>

    <!-- SUBMIT BUTTON -->
    <div align="center">
        <button type="button" id="submitButton">Submit</button>
    </div>

    <!-- JAVASCRIPT
        it need to read user's Q and A, I also settle a submit button
        when it being click, i belived input need to be using local Storage -->

    <!-- SAVED CARD DISPLAY (HIDDEN UNTIL SUBMIT) -->
    <div id="savedCard" style="display: none;" align="center">
        <h2 id="savedQuestion"></h2>
        <h3 id="savedAnswer"></h3>
        <img src="cs320_character.gif" width="350">

    </div>

    <!-- BACK TO MENU AT BOTTOM LEFT -->
    <a href="<Menu>.html"
       style="position: fixed; bottom: 50px; left: 10px;">
       Back to menu
    </a>

    </font>

    <!-- JAVASCRIPT CODE CAN BE ADDED HERE LATER -->

</body>
</html>
